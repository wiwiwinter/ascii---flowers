<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Whispering Garden: an interactive animated botanical garden of roses, lilies, dandelions, and white blossoms swaying in morning light.">
  <title>Whispering Garden</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23FCF8F2'/%3E%3Cpath d='M32 14c7 4 12 10 12 18s-5 14-12 18c-7-4-12-10-12-18s5-14 12-18z' fill='%23C85A6B' opacity='0.85'/%3E%3Cpath d='M18 26c8-1 14 2 18 8-2 8-8 14-16 14-5-6-6-14-2-22z' fill='%23E8A6B4' opacity='0.9'/%3E%3Cpath d='M46 26c-8-1-14 2-18 8 2 8 8 14 16 14 5-6 6-14 2-22z' fill='%23A84452' opacity='0.85'/%3E%3Ccircle cx='32' cy='31' r='6' fill='%23852F3C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage" aria-label="Interactive Flower Garden">
    <canvas
      id="garden-canvas"
      class="garden-canvas"
      role="img"
      aria-label="Animated garden with swaying roses, lilies, dandelions, floating seeds, and falling petals"
    ></canvas>

    <!-- Introductory Screen -->
    <section id="intro-screen" class="intro-screen" aria-labelledby="intro-title">
      <div class="intro-card">
        <svg class="botanical-mark" viewBox="0 0 120 36" width="120" height="36" aria-hidden="true">
          <path d="M12 24 C34 22, 48 18, 60 12 C72 18, 86 22, 108 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          <path d="M60 12 C56 6, 59 3, 60 3 C61 3, 64 6, 60 12 Z" fill="currentColor" opacity="0.7" />
          <path d="M44 19 C38 14, 34 15, 33 17 C36 20, 41 21, 44 19 Z" fill="currentColor" opacity="0.55" />
          <path d="M76 19 C82 14, 86 15, 87 17 C84 20, 79 21, 76 19 Z" fill="currentColor" opacity="0.55" />
          <circle cx="60" cy="12" r="2.2" fill="#C8A253" />
        </svg>

        <h1 id="intro-title" class="intro-title">Whispering Garden</h1>
        <p class="intro-subtitle">
          Roses, lilies, dandelions, and white blossoms unfurling in warm morning light.
        </p>

        <div class="intro-actions">
          <button id="start-btn" type="button" class="btn-primary">
            Begin Bloom
          </button>

          <label class="music-pref" for="intro-music-toggle">
            <input id="intro-music-toggle" type="checkbox" checked>
            <span>Play gentle ambient music</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Minimal Garden HUD -->
    <header id="garden-hud" class="garden-hud" aria-hidden="true">
      <div class="garden-brand" aria-label="Whispering Garden">
        <span class="brand-name">Whispering Garden</span>
      </div>

      <nav class="hud-controls" aria-label="Garden controls">
        <button
          id="breeze-btn"
          type="button"
          class="hud-btn"
          aria-label="Send a gentle breeze through the garden"
          title="Send a breeze (Space)"
        >
          <svg class="hud-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M3 9h11.5a2.5 2.5 0 1 0-2.4-3.2M3 13h15a2.5 2.5 0 1 1-2.4 3.2M3 17h7.5a2 2 0 1 1-1.9 2.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span class="hud-label">Breeze</span>
        </button>

        <button
          id="replay-btn"
          type="button"
          class="hud-btn"
          aria-label="Replay the flower bloom animation"
          title="Replay bloom (R)"
        >
          <svg class="hud-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3M4.5 12V7.5M4.5 12H9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="hud-label">Replay</span>
        </button>

        <button
          id="music-btn"
          type="button"
          class="hud-btn"
          aria-pressed="false"
          aria-label="Unmute background music"
          title="Toggle ambient music (M)"
        >
          <svg class="hud-icon icon-sound-on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M11 6L6.5 9.5H3.5v5h3L11 18V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M15 9.2a4.2 4.2 0 0 1 0 5.6M17.8 6.8a7.6 7.6 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <svg class="hud-icon icon-sound-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M11 6L6.5 9.5H3.5v5h3L11 18V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span class="hud-label" id="music-btn-label">Sound Off</span>
        </button>
      </nav>
    </header>

    <!-- Subtle interaction hint -->
    <p id="interaction-hint" class="interaction-hint" aria-live="polite">
      Move across the blooms to stir the breeze, or tap to scatter petals.
    </p>
  </main>

  <noscript>
    <div class="noscript-banner">
      Whispering Garden requires JavaScript to render the animated flowers and interactions.
    </div>
  </noscript>

  <script src="js/audio.js"></script>
  <script src="js/flowers.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
